name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    steps:
      - name: Start CI log
        run: echo "Starting CI pipeline for CaramelStray backend..."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log repository checkout
        run: echo "Repository checkout completed successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Log Java setup
        run: java -version

      - name: Start PostgreSQL Container for Testing
        run: |
          echo "Starting PostgreSQL container with health validation..."
          docker compose up -d --wait --wait-timeout 60
          echo "PostgreSQL container is ready for testing."
          docker compose ps

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Log cache setup
        run: echo "Maven and SonarQube cache steps completed."

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Starting Maven verify and Sonar analysis..."
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=AlitaAmancio_caramelstray-backend-ci
          echo "Build, test, and analysis completed successfully."

      - name: Stop PostgreSQL Container
        if: always()
        run: |
          echo "Stopping PostgreSQL container..."
          docker compose down
          echo "PostgreSQL container stopped."